<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guides & Case Studies | Chabila Borkar</title>
<meta name="description" content="Guides and case studies by Chabila Borkar on payments, eCommerce, and business analysis.">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f0e0c;
    --paper: #f5f3ee;
    --cream: #ede9e1;
    --mid: #7a7670;
    --accent: #1a3a5c;
    --gold: #b8965a;
    --rule: #d4cfc5;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.25rem 3rem;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(245,243,238,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a.current { color: var(--ink); border-bottom: 1px solid var(--gold); padding-bottom: 3px; }

  main { flex: 1; padding: 9rem 5rem 5rem; max-width: 980px; width: 100%; }

  .label {
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.75rem;
  }
  .label::before { content: ''; width: 28px; height: 1px; background: var(--gold); }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.2rem, 4.5vw, 3.2rem);
    line-height: 1.1; letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; color: var(--accent); }

  .search-wrap { margin-top: 2.2rem; }
  #search {
    width: 100%; max-width: 380px;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
    padding: 0.7rem 0; background: transparent;
    border: none; border-bottom: 1px solid var(--rule);
    color: var(--ink); outline: none; transition: border-color 0.2s;
  }
  #search:focus { border-bottom-color: var(--accent); }
  #search::placeholder { color: var(--mid); }

  .group { margin-top: 3.2rem; }
  .group-title {
    font-size: 0.74rem; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent);
    padding-bottom: 0.8rem; border-bottom: 1px solid var(--ink);
  }
  .link-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    padding: 1.05rem 0; border-bottom: 1px solid var(--rule);
    text-decoration: none; color: var(--ink);
    transition: padding-left 0.2s ease, color 0.2s ease;
  }
  .link-row:hover { padding-left: 0.6rem; color: var(--accent); }
  .link-left { display: flex; align-items: baseline; gap: 1.1rem; }
  .link-num { font-family: 'DM Serif Display', serif; font-size: 0.95rem; color: var(--gold); min-width: 1.6rem; }
  .link-title { font-family: 'DM Serif Display', serif; font-size: 1.25rem; }
  .link-right { display: flex; align-items: center; gap: 0.9rem; flex-shrink: 0; }
  .badge-new {
    font-size: 0.62rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    color: #fff; background: var(--accent); padding: 0.15rem 0.5rem;
  }
  .link-arrow { color: var(--mid); transition: transform 0.2s ease, color 0.2s ease; }
  .link-row:hover .link-arrow { transform: translateX(4px); color: var(--gold); }

  .empty { margin-top: 3rem; color: var(--mid); font-size: 0.95rem; display: none; }

  footer {
    background: var(--ink); color: rgba(255,255,255,0.35);
    padding: 2rem 5rem;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.78rem;
  }
  footer a { color: rgba(255,255,255,0.35); text-decoration: none; }
  footer a:hover { color: rgba(255,255,255,0.7); }

  @media (max-width: 720px) {
    nav { padding: 1.25rem 1.5rem; }
    .nav-links { display: none; }
    main { padding: 7rem 1.5rem 3rem; }
    .link-title { font-size: 1.1rem; }
    footer { flex-direction: column; gap: 0.5rem; text-align: center; padding: 2rem 1.5rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">Chabila Borkar</a>
  <ul class="nav-links">
    <li><a href="../index.html#about">About</a></li>
    <li><a href="../index.html#expertise">Expertise</a></li>
    <li><a href="../index.html#experience">Experience</a></li>
    <li><a href="../index.html#contact">Contact</a></li>
    <li><a href="./" class="current">Guides</a></li>
  </ul>
</nav>

<main>
  <div class="label">Library</div>
  <h1>Guides & <em>case studies</em></h1>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search…" autocomplete="off" aria-label="Search guides and case studies">
  </div>

  <div id="list"></div>
  <p class="empty" id="empty">Nothing matches that search.</p>
</main>

<footer>
  <span>© <span id="year"></span> Chabila Borkar</span>
  <span><a href="../index.html">← Back to portfolio</a></span>
</footer>

<!-- All the content lives in this file. Edit it to add or change links. -->
<script src="guides-data.js"></script>

<script>
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');

  function render(filter) {
    const q = (filter || '').trim().toLowerCase();
    listEl.innerHTML = '';
    let shown = 0;

    // Groups appear in CATEGORY_ORDER; any category not listed there goes at the end
    const extras = [...new Set(GUIDES.map(g => g.category))].filter(c => !CATEGORY_ORDER.includes(c));
    const order = [...CATEGORY_ORDER, ...extras];

    order.forEach(cat => {
      const items = GUIDES.filter(g => g.category === cat && (!q || g.title.toLowerCase().includes(q)));
      if (!items.length) return;

      const group = document.createElement('section');
      group.className = 'group';

      const title = document.createElement('h2');
      title.className = 'group-title';
      title.textContent = cat;
      group.appendChild(title);

      items.forEach((g, i) => {
        const a = document.createElement('a');
        a.className = 'link-row';
        a.href = g.url;

        const left = document.createElement('span');
        left.className = 'link-left';
        const num = document.createElement('span');
        num.className = 'link-num';
        num.textContent = String(i + 1).padStart(2, '0');
        const t = document.createElement('span');
        t.className = 'link-title';
        t.textContent = g.title;
        left.append(num, t);

        const right = document.createElement('span');
        right.className = 'link-right';
        if (g.isNew) {
          const b = document.createElement('span');
          b.className = 'badge-new';
          b.textContent = 'New';
          right.appendChild(b);
        }
        const arrow = document.createElement('span');
        arrow.className = 'link-arrow';
        arrow.textContent = '→';
        right.appendChild(arrow);

        a.append(left, right);
        group.appendChild(a);
        shown++;
      });

      listEl.appendChild(group);
    });

    emptyEl.style.display = shown ? 'none' : 'block';
  }

  searchEl.addEventListener('input', e => render(e.target.value));
  render('');
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
